<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MATCH Golf — Direction E: Glass</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif;
    gap: 48px; padding: 48px; flex-wrap: wrap;
  }
  .label {
    color: #555; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; text-align: center; margin-bottom: 16px;
  }
  .phone {
    width: 390px; height: 844px;
    border-radius: 54px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 2px #333, 0 0 0 4px #1a1a1a, 0 40px 80px rgba(0,0,0,0.7);
  }

  /* Animated gradient bg */
  .bg {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% -10%, #1A4D2E 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 20%, #0D3320 0%, transparent 55%),
      radial-gradient(ellipse 70% 80% at 50% 100%, #0A1F14 0%, transparent 70%),
      #080F0A;
  }

  /* Frosted orbs */
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(60px); pointer-events: none; z-index: 1;
  }
  .orb-1 { width: 280px; height: 280px; background: rgba(34,197,94,0.12); top: -80px; left: -60px; }
  .orb-2 { width: 200px; height: 200px; background: rgba(16,185,129,0.08); top: 200px; right: -50px; }
  .orb-3 { width: 240px; height: 240px; background: rgba(5,150,105,0.06); bottom: 100px; left: 20px; }

  .dynamic-island {
    width: 120px; height: 34px; background: #000;
    border-radius: 20px; position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
  }

  .status-bar {
    height: 54px; display: flex; align-items: flex-end;
    justify-content: space-between; padding: 0 32px 10px;
    position: relative; z-index: 20;
  }
  .status-bar .time { font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.9); }

  /* glass mixin */
  .glass {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .glass-strong {
    background: rgba(255,255,255,0.09);
    backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.14);
  }

  /* Header */
  .header {
    padding: 6px 24px 18px;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 20;
  }
  .logo-area { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 44px; height: 44px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(34,197,94,0.3), rgba(16,185,129,0.15));
    border: 1px solid rgba(34,197,94,0.25);
    backdrop-filter: blur(10px);
  }
  .logo-text h1 {
    font-size: 24px; font-weight: 800; color: #fff;
    letter-spacing: -0.03em; line-height: 1;
  }
  .logo-text p {
    font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
    color: rgba(255,255,255,0.4); text-transform: uppercase; margin-top: 2px;
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: rgba(255,255,255,0.9);
    position: relative;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
  }
  .avatar-dot {
    position: absolute; bottom: -2px; right: -2px;
    width: 12px; height: 12px; background: #22C55E;
    border-radius: 50%; border: 2px solid rgba(8,15,10,0.8);
  }

  /* Content */
  .content { position: relative; z-index: 20; padding: 0 20px; }

  /* Stats cards */
  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; margin-bottom: 14px;
  }
  .stat-card {
    border-radius: 16px; padding: 14px 14px 12px;
  }
  .stat-num {
    font-size: 30px; font-weight: 800; color: #fff;
    letter-spacing: -0.04em; line-height: 1;
  }
  .stat-num.green { color: #4ADE80; }
  .stat-label {
    font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.35);
    letter-spacing: 0.06em; text-transform: uppercase; margin-top: 3px;
  }

  /* CTA */
  .cta-btn {
    border-radius: 18px; padding: 16px 20px; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, rgba(34,197,94,0.2), rgba(16,185,129,0.1));
    border: 1px solid rgba(34,197,94,0.25); backdrop-filter: blur(20px);
    cursor: pointer;
  }
  .cta-left { display: flex; align-items: center; gap: 12px; }
  .cta-icon {
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.3);
    display: flex; align-items: center; justify-content: center;
  }
  .cta-main { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
  .cta-sub { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 1px; }
  .cta-arrow {
    width: 32px; height: 32px; border-radius: 10px;
    background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.2);
    display: flex; align-items: center; justify-content: center;
  }

  /* Section */
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.3);
    margin-bottom: 8px; display: flex; align-items: center; gap: 7px;
  }
  .s-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4ADE80; box-shadow: 0 0 8px rgba(74,222,128,0.5);
  }

  /* Round card */
  .round-card {
    border-radius: 20px; padding: 16px 18px; margin-bottom: 10px;
    position: relative; overflow: hidden;
  }
  .round-card.active {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(74,222,128,0.2);
    backdrop-filter: blur(20px);
  }
  .round-card.past {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    backdrop-filter: blur(15px);
  }
  .round-card.active::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, rgba(74,222,128,0.6), transparent 70%);
  }
  .card-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; }
  .course-name { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
  .status-pill {
    font-size: 11px; font-weight: 600; padding: 4px 10px;
    border-radius: 20px; letter-spacing: 0.04em;
  }
  .status-pill.live {
    background: rgba(74,222,128,0.12); color: #4ADE80;
    border: 1px solid rgba(74,222,128,0.2);
  }
  .status-pill.done {
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .card-meta { display: flex; gap: 14px; margin-bottom: 8px; }
  .meta-item { font-size: 12px; color: rgba(255,255,255,0.35); }
  .meta-item strong { color: rgba(255,255,255,0.6); font-weight: 600; }
  .games-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .game-chip {
    font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 6px;
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .round-card.active .game-chip {
    background: rgba(74,222,128,0.08); color: rgba(74,222,128,0.6);
    border-color: rgba(74,222,128,0.12);
  }
  .progress-wrap { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .progress-track {
    flex: 1; height: 3px; background: rgba(255,255,255,0.08); border-radius: 3px;
  }
  .progress-fill { height: 100%; width: 67%; background: linear-gradient(90deg, #22C55E, #4ADE80); border-radius: 3px; }
  .progress-label { font-size: 11px; font-weight: 600; color: #4ADE80; white-space: nowrap; }

  /* Bottom nav */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0; height: 90px;
    background: rgba(5,12,8,0.85); backdrop-filter: blur(30px);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: flex-start; justify-content: space-around; padding: 12px 0 0;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
  .nav-label { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.2); }
  .nav-item.active .nav-label { color: #4ADE80; }
</style>
</head>
<body>
<div>
  <p class="label">Direction E — Glass &amp; Depth</p>
  <div class="phone">
    <div class="bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="dynamic-island"></div>

    <div class="status-bar">
      <span class="time">9:41</span>
      <div style="display:flex;gap:6px;align-items:center;opacity:0.8;">
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="3" fill="none" stroke="white" stroke-width="1.5"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="white" opacity="0.5"/><rect x="1.5" y="2.5" width="18" height="7" rx="2" fill="white"/></svg>
      </div>
    </div>

    <div class="header">
      <div class="logo-area">
        <div class="logo-mark">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <line x1="8" y1="3" x2="8" y2="19" stroke="rgba(74,222,128,0.9)" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M8 3 L19 7.5 L8 12 Z" fill="rgba(74,222,128,0.9)"/>
            <ellipse cx="8" cy="19.5" rx="4.5" ry="1.5" fill="rgba(74,222,128,0.2)"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>MATCH</h1>
          <p>Golf Scorecard</p>
        </div>
      </div>
      <div class="avatar">RC<span class="avatar-dot"></span></div>
    </div>

    <div class="content">
      <div class="stats-grid">
        <div class="stat-card glass">
          <div class="stat-num green">2</div>
          <div class="stat-label">Active</div>
        </div>
        <div class="stat-card glass">
          <div class="stat-num">1</div>
          <div class="stat-label">Watching</div>
        </div>
        <div class="stat-card glass">
          <div class="stat-num">14</div>
          <div class="stat-label">Rounds</div>
        </div>
      </div>

      <div class="cta-btn">
        <div class="cta-left">
          <div class="cta-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
          <div>
            <div class="cta-main">New Round</div>
            <div class="cta-sub">Set up games &amp; players</div>
          </div>
        </div>
        <div class="cta-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>

      <div class="section-label"><span class="s-dot"></span> Live Now</div>

      <div class="round-card active">
        <div class="card-row">
          <div class="course-name">Pebble Beach</div>
          <span class="status-pill live">● Live</span>
        </div>
        <div class="card-meta">
          <span class="meta-item"><strong>4</strong> players</span>
          <span class="meta-item">Today · 7am</span>
        </div>
        <div class="games-row">
          <span class="game-chip">Nassau</span>
          <span class="game-chip">Skins</span>
          <span class="game-chip">Wolf</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill"></div></div>
          <span class="progress-label">12 / 18</span>
        </div>
      </div>

      <div class="section-label" style="margin-top:4px;">History</div>

      <div class="round-card past">
        <div class="card-row">
          <div class="course-name">Augusta National</div>
          <span class="status-pill done">Done</span>
        </div>
        <div class="card-meta">
          <span class="meta-item"><strong>3</strong> players</span>
          <span class="meta-item">Mar 22</span>
        </div>
        <div class="games-row">
          <span class="game-chip">Match Play</span>
          <span class="game-chip">Stableford</span>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="nav-label">Home</span>
      </div>
      <div class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        <span class="nav-label">Friends</span>
      </div>
      <div class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span class="nav-label">Stats</span>
      </div>
      <div class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="nav-label">Profile</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
