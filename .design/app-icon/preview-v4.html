<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MATCH Golf — Icon v4 Final</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    font-family: 'Inter', -apple-system, sans-serif;
    color: #fff;
    padding: 40px;
  }
  h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.02em; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 48px; }
  .row {
    display: flex;
    gap: 32px;
    align-items: end;
    margin-bottom: 20px;
  }
  .icon-wrapper {
    border-radius: 46px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .icon-wrapper svg { display: block; }
  .label { color: #999; font-size: 12px; margin-top: 8px; text-align: center; }
  .sm { border-radius: 14px; }
  .md { border-radius: 20px; }
  .xs { border-radius: 8px; }
  .xxs { border-radius: 5px; }
</style>
</head>
<body>

<h1>MATCH — 1C Final</h1>
<p class="subtitle">Chartreuse A, aligned. "SCORE. BET. WIN." subtitle.</p>

<div class="row">
  <div>

        <rect width="512" height="512" fill="#0A0A0A"/>
        <text x="256" y="280" font-family="Inter, sans-serif" font-weight="900" font-size="118" fill="#FFFFFF" text-anchor="middle" letter-spacing="-3">M<tspan fill="#F0EE3A">A</tspan>TCH</text>

  <div>
    <div class="icon-wrapper xxs">
      <svg viewBox="0 0 512 512" width="40" height="40" xmlns="http://www.w3.org/2000/svg">

    <div style="text-align: center;">
