<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MATCH Golf — Plush Flag (Final Icon)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    font-family: -apple-system, sans-serif;
    color: #fff;
    padding: 40px;
    text-align: center;
  }
  h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 52px; }
  .sizes { display: flex; justify-content: center; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 40px; }
  .size-item { text-align: center; }
  .size-item img { border-radius: 22%; box-shadow: 0 8px 30px rgba(0,0,0,0.5); display: block; margin: 0 auto 8px; }
  .size-label { color: #888; font-size: 11px; }
  .hero { margin-bottom: 60px; }
  .hero img { width: 220px; height: 220px; border-radius: 48px; box-shadow: 0 16px 50px rgba(0,0,0,0.6); }
  .hero-label { margin-top: 14px; font-weight: 700; font-size: 18px; }
  .hero-desc { color: #999; font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Plush Flag — Final App Icon</h1>
  <p class="subtitle">Soft 3D golf flag, chartreuse body, white pole, dark background</p>

  <div class="hero">
    <img src="../../brand/app-icon-1024.png" alt="Plush Flag 1024">
    <div class="hero-label">App Icon</div>
    <div class="hero-desc">1024 &times; 1024</div>
  </div>

  <div class="sizes">
    <div class="size-item">
      <img src="../../brand/app-icons-all-sizes/AppIcon-180.png" width="180" height="180">
      <div class="size-label">180px (iPhone @3x)</div>
    </div>
    <div class="size-item">
      <img src="../../brand/app-icons-all-sizes/AppIcon-120.png" width="120" height="120">
      <div class="size-label">120px (iPhone @2x)</div>
    </div>
    <div class="size-item">
      <img src="../../brand/app-icons-all-sizes/AppIcon-87.png" width="87" height="87">
      <div class="size-label">87px (Spotlight @3x)</div>
    </div>
    <div class="size-item">
      <img src="../../brand/app-icons-all-sizes/AppIcon-60.png" width="60" height="60">
      <div class="size-label">60px (Home @1x)</div>
    </div>
    <div class="size-item">
      <img src="../../brand/app-icons-all-sizes/AppIcon-40.png" width="40" height="40">
      <div class="size-label">40px (Spotlight)</div>
    </div>
    <div class="size-item">
      <img src="../../brand/app-icons-all-sizes/AppIcon-29.png" width="29" height="29">
      <div class="size-label">29px (Settings)</div>
    </div>
    <div class="size-item">
      <img src="../../brand/app-icons-all-sizes/AppIcon-20.png" width="20" height="20">
      <div class="size-label">20px (Notification)</div>
    </div>
  </div>

  <h2 style="margin-bottom:20px; font-size:20px;">Splash Screen</h2>
  <div>
    <img src="../../brand/splash-screen.png" width="300" height="300" style="border-radius:12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);">
    <div class="size-label" style="margin-top:8px;">1024 &times; 1024 (shown at 300px)</div>
  </div>
</body>
</html>
