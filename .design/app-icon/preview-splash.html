<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MATCH Golf — Splash Screen Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    font-family: -apple-system, sans-serif;
    color: #fff;
    padding: 40px;
    text-align: center;
  }
  h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 52px; }
  .previews { display: flex; justify-content: center; align-items: start; gap: 40px; flex-wrap: wrap; }
  .preview-item { text-align: center; }
  .preview-item img { box-shadow: 0 12px 40px rgba(0,0,0,0.5); border-radius: 12px; display: block; margin: 0 auto 12px; }
  .label { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .desc { color: #888; font-size: 12px; }
  .phone-frame {
    width: 280px; height: 606px;
    border: 3px solid #333;
    border-radius: 36px;
    overflow: hidden;
    margin: 0 auto 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    position: relative;
    background: #0A0A0A;
  }
  .phone-frame img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 0;
    box-shadow: none;
    margin: 0;
  }
  .phone-notch {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 28px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 2;
  }
</style>
</head>
<body>
  <h1>Splash Screen Preview</h1>
  <p class="subtitle">MATCH wordmark with chartreuse A &middot; "SCORE. BET. WIN."</p>

  <div class="previews">
    <div class="preview-item">
      <div class="phone-frame">
        <div class="phone-notch"></div>
        <img src="../../brand/splash-screen.png" alt="Splash 1024">
      </div>
      <div class="label">iPhone</div>
      <div class="desc">1024 &times; 1024</div>
    </div>

    <div class="preview-item">
      <img src="../../brand/splash-screen.png" width="400" height="400" alt="Splash 1024">
      <div class="label">Full Size</div>
      <div class="desc">1024 &times; 1024</div>
    </div>

    <div class="preview-item">
      <img src="../../brand/splash-screen-2732.png" width="300" height="300" alt="Splash 2732">
      <div class="label">iPad / Retina</div>
      <div class="desc">2732 &times; 2732</div>
    </div>
  </div>
</body>
</html>
