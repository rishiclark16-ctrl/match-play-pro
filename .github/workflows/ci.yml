name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_SUPABASE_PROJECT_ID: puqgbsxabcyxrbwwoznn
      VITE_SUPABASE_URL: https://puqgbsxabcyxrbwwoznn.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (src only)
        run: bunx eslint src --max-warnings 50

      - name: Unit tests (hooks/lib/engine/components)
        # Page tests are run separately because their module mocks leak
        # into the same worker process under bun's CI scheduler.
        # (vitest also has vi.mock hoisting issues with this codebase —
        # see CLAUDE.md test infra notes.)
        run: bun test src/hooks src/lib src/engine src/components

      - name: Page tests (isolated process)
        run: bun test src/pages

      - name: Build (development mode, no Sentry upload)
        run: bun run build:dev
