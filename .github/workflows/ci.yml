name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_SUPABASE_PROJECT_ID: puqgbsxabcyxrbwwoznn
      VITE_SUPABASE_URL: https://puqgbsxabcyxrbwwoznn.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (src only)
        run: bunx eslint src --max-warnings 50

      - name: Typecheck (ratchet — error count may only go down)
        run: ./scripts/typecheck-ratchet.sh

      - name: Unit tests (hooks/lib/engine/components)
        # Page tests are run separately because their module mocks leak
        # into the same worker process under bun's CI scheduler.
        # (vitest also has vi.mock hoisting issues with this codebase —
        # see CLAUDE.md test infra notes.)
        run: bun test src/hooks src/lib src/engine src/components

      - name: Page tests (isolated process)
        run: bun test src/pages

      - name: Build (development mode, no Sentry upload)
        run: bun run build:dev

  qa:
    name: QA (screens + journeys, 3 device sizes)
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.59 can't install
    # Chromium dependencies for. Move this when Playwright is upgraded.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      # The QA suite mocks the backend in the browser; these only let the app boot.
      VITE_SUPABASE_PROJECT_ID: puqgbsxabcyxrbwwoznn
      VITE_SUPABASE_URL: https://puqgbsxabcyxrbwwoznn.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: qa-mocked

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Run QA suite
        # New console errors, overflow, small tap targets or accessibility violations
        # fail the run; known debt lives in tests/qa/baseline (see tests/qa/README.md).
        run: bun run test:qa

      - name: Upload QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.run_number }}
          path: |
            qa-report/
            test-results/
          retention-days: 14

  ios-sync-check:
    name: iOS Capacitor Sync + Pod Install
    runs-on: macos-latest
    timeout-minutes: 25

    env:
      VITE_SUPABASE_PROJECT_ID: puqgbsxabcyxrbwwoznn
      VITE_SUPABASE_URL: https://puqgbsxabcyxrbwwoznn.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Node (required for cap sync)
        # @capacitor/cli's template extractor crashes under bun
        # (TypeError: Cannot read properties of undefined (reading 'extract'))
        # so we drive cap sync with node/npx. CLAUDE.md documents this:
        # bun is for install/build, npx for cap sync ios.
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle (Capacitor needs dist/)
        run: bun run build

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: Pod install
        working-directory: ios/App
        run: pod install
