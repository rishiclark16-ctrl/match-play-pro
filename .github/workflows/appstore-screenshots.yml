name: App Store screenshots

# Runs when the screenshot files change, or by hand. Replaces the screenshots on the App Store version that is open
# for editing with ios/App/fastlane/screenshots/en-US/*.png. Never submits.
on:
  push:
    paths:
      - 'ios/App/fastlane/screenshots/**'
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Version to update (blank = the one in Prepare for Submission)'
        required: false
        default: ''

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APP_VERSION: ${{ inputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App
      - name: Upload screenshots
        working-directory: ios/App
        run: bundle exec fastlane ci_screenshots
