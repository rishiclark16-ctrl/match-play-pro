<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#22C55E"/>
  <!-- Subtle grass texture lines -->
  <g stroke="#1EA852" stroke-width="2" opacity="0.4">
    <line x1="0" y1="120" x2="1024" y2="120"/>
    <line x1="0" y1="240" x2="1024" y2="240"/>
    <line x1="0" y1="360" x2="1024" y2="360"/>
    <line x1="0" y1="480" x2="1024" y2="480"/>
    <line x1="0" y1="600" x2="1024" y2="600"/>
    <line x1="0" y1="720" x2="1024" y2="720"/>
    <line x1="0" y1="840" x2="1024" y2="840"/>
  </g>
  <!-- Pin pole -->
  <rect x="496" y="200" width="32" height="700" fill="#0A0A0A"/>
  <!-- Flag rectangle with $ -->
  <rect x="528" y="200" width="340" height="240" fill="#F0EE3A"/>
  <text x="698" y="320" fill="#0A0A0A"
    font-family="Inter, Arial, sans-serif"
    font-weight="900" font-size="240" text-anchor="middle"
    dominant-baseline="central">$</text>
  <!-- Hole -->
  <ellipse cx="512" cy="910" rx="90" ry="22" fill="#0A0A0A"/>
</svg>
